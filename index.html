<!DOCTYPE html>
<html lang="es">
<head>

<meta property="og:type" content="website">
<meta property="og:url" content="https://iamfenixdesign.github.io/web/">
<link rel="canonical" href="https://iamfenixdesign.github.io/web/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='14' y='44' width='72' height='40' rx='10' fill='%23ff8fc7'/%3E%3Crect x='30' y='26' width='40' height='22' rx='8' fill='%23b79cff'/%3E%3Crect x='46' y='8' width='8' height='20' rx='3' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
:root{--acc:#0067c0;--tx:#1a1a1a;--mu:#5d5d5d;--win:rgba(243,243,243,.8);--pane:rgba(251,251,251,.95);--card:rgba(255,255,255,.9);--bd:rgba(0,0,0,.09);--tab:rgba(0,0,0,.05);--tb:rgba(243,243,243,.78);--sh:0 18px 50px rgba(0,0,0,.35);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#60cdff;--tx:#fff;--mu:#c7c7c7;--win:rgba(32,32,32,.8);--pane:rgba(38,38,38,.95);--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tab:rgba(255,255,255,.08);--tb:rgba(28,28,28,.8)}}
:root[data-theme="dark"]{--acc:#60cdff;--tx:#fff;--mu:#c7c7c7;--win:rgba(32,32,32,.8);--pane:rgba(38,38,38,.95);--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tab:rgba(255,255,255,.08);--tb:rgba(28,28,28,.8)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);background:radial-gradient(60% 70% at 18% 30%,rgba(255,110,199,.6),transparent 60%),radial-gradient(55% 65% at 82% 22%,rgba(124,92,255,.65),transparent 60%),radial-gradient(70% 70% at 58% 95%,rgba(0,170,255,.6),transparent 60%),linear-gradient(135deg,#1b2a6b,#34196b);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:1em;height:1em;flex:none}
.desk{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
.area{position:relative;min-height:0}
#wins{position:absolute;inset:0;pointer-events:none}
.win{pointer-events:auto;position:absolute;display:none;flex-direction:column;left:calc(8px + var(--o,0)*26px);top:calc(var(--o,0)*26px);width:min(960px,calc(100% - 16px - var(--o,0)*26px));height:auto;max-height:calc(100% - 12px - var(--o,0)*26px);background:var(--win);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.win.open{display:flex}.win.mini{display:none!important}
.win.max{left:0;top:0;width:100%;height:auto;max-height:100%}
.win:not(.act) .tb{opacity:.8}
.tt{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:.86rem;font-weight:600}.tt .ic{font-size:16px;color:var(--acc)}
.icons{display:none}
.di{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;padding:8px 4px;border:1px solid transparent;border-radius:6px;background:transparent;color:#fff;font-size:.78rem;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:center}
.di:hover,.di:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);outline:0}
.fi{position:relative;width:58px;height:50px}.fi .f{width:100%;height:100%}
.fi .ic{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:22px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.ab b{font-weight:400}
.tb{display:flex;align-items:center;height:40px;padding:0 0 0 12px;gap:8px;background:var(--tb)}
.tabs{display:flex;gap:2px;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;height:36px;min-width:0;padding:0 14px;border:0;border-radius:8px 8px 0 0;background:transparent;font-size:.86rem;white-space:nowrap}
.tab .ic{font-size:16px;color:var(--acc)}
.tab:hover{background:var(--tab)}
.tab.on{background:var(--pane);font-weight:600}
.wc{display:flex;align-self:flex-start}
.wc button{width:46px;height:32px;border:0;background:transparent;display:grid;place-items:center;font-size:14px}
.wc button:hover{background:var(--tab)}.wc button:last-child:hover{background:#c42b1c;color:#fff}
.ab{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--pane);border-bottom:1px solid var(--bd);font-size:.8rem;color:var(--mu)}
.ab span{padding:5px 12px;border-radius:6px;background:var(--tab);color:var(--tx)}
.pane{flex:0 1 auto;min-height:0;overflow:auto;background:var(--pane);padding:clamp(14px,3vw,28px) clamp(14px,3vw,28px) 14px;position:relative}
.sec{display:none}.sec.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h2{margin:0 0 4px;font-size:1.6rem;font-weight:600}
.mu{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}
/* inicio: se muestra como fondo de escritorio, detrás de las ventanas */
.home{position:absolute;inset:0;overflow:auto;display:flex;color:#fff;--tx:#fff;--mu:rgba(255,255,255,.86);--acc:#fff;--card:rgba(255,255,255,.14);--bd:rgba(255,255,255,.3);--tab:rgba(255,255,255,.22)}
.homei{margin:auto;width:min(1000px,100%);padding:48px 18px 12px}
.area>.bun{position:absolute;z-index:1;pointer-events:none;top:calc(-10px - env(safe-area-inset-top,0px));left:-10px;right:-10px;margin:0;padding-top:env(safe-area-inset-top,0px);border-top:0;height:calc(36px + env(safe-area-inset-top,0px))}
.area>.bun::before{content:"";position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);border-top:2px solid rgba(255,255,255,.85)}
.home .ht,.home .wish{text-shadow:0 2px 12px rgba(0,0,0,.35)}
.home h1 b{text-shadow:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.3))}
.home .w{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.home .w .bx{background:linear-gradient(135deg,#ff5fa2,#7c5cff)}
/* inicio */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:center;overflow:hidden;padding-bottom:10px}
.bun{grid-column:1/-1;display:flex;justify-content:space-between;height:36px;border-top:2px solid var(--mu);margin:2px -4px 0}
.bun i{flex:1;max-width:46px;height:34px;clip-path:polygon(0 0,100% 0,50% 100%)}
.ht{position:relative;z-index:1}
.eb{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;background:var(--tab);font-size:.85rem;color:var(--acc);font-weight:600}
h1{margin:12px 0 0;font-size:clamp(2rem,5.6vw,3.6rem);line-height:1;letter-spacing:-.02em;font-weight:700}
h1 b{display:block;font-size:clamp(4rem,15vw,8rem);line-height:.95;background:linear-gradient(90deg,#ff5fa2,#7c5cff 55%,#0aa5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:12px 0 0;font-size:1.05rem;color:var(--mu);max-width:30ch}
.cw{position:relative;z-index:1;text-align:center}
#cake{width:min(100%,260px);cursor:pointer;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fk .5s ease-in-out infinite alternate}
@keyframes fk{to{transform:scale(.88,1.1) rotate(4deg)}}
#cake.out .flame{display:none}
.wish{margin:6px 0 0;font-size:.85rem;color:var(--mu)}
.bl{position:absolute;width:44px;opacity:.95;animation:fy 6s ease-in-out infinite alternate;color:var(--mu)}
@keyframes fy{to{transform:translateY(-18px) rotate(4deg)}}
.cf2{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;opacity:.85;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(560px) rotate(540deg)}}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:99}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.w{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;transition:transform .15s,background .15s}
.w:hover{transform:translateY(-2px);background:var(--tab)}
.w .bx{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--acc);color:#fff;font-size:22px;flex:none}
.w b{display:block}.w small{color:var(--mu)}
/* videos */
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vc{display:block;padding:10px;text-align:left;border:1px solid var(--bd);border-radius:10px;background:var(--card);transition:transform .15s}
.vc:hover{transform:translateY(-3px)}
.th{aspect-ratio:16/9;border-radius:8px;display:grid;place-items:center;margin-bottom:8px;color:#fff;font-size:34px;background:linear-gradient(135deg,hsl(var(--h,210) 80% 55%),hsl(calc(var(--h,210) + 50) 80% 45%))}
.vc.add .th{background:var(--tab);color:var(--acc);border:1px dashed var(--bd)}
.vc b{display:block;font-size:.95rem}.vc small{color:var(--mu)}
dialog{width:min(780px,94vw);padding:0;border:1px solid var(--bd);border-radius:12px;background:var(--pane);color:var(--tx);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 16px}
.dh button{width:34px;height:34px;border:0;border-radius:6px;background:transparent;font-size:16px;display:grid;place-items:center}
.dh button:hover{background:var(--tab)}
dialog video{display:block;width:100%;max-height:70vh;background:#000}
/* dedicatoria */
.note{max-width:640px;padding:clamp(18px,4vw,34px);position:relative;overflow:hidden}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(#ff5fa2,#7c5cff,#0aa5ff)}
.note .ic{font-size:34px;color:#ff5fa2}
.note h3{margin:8px 0 12px;font-size:1.5rem}
.note p{font-size:1.05rem;line-height:1.65;margin:0 0 12px}
.sig{margin-top:18px;font-family:Caveat,"Segoe Script",cursive;font-size:1.7rem;color:var(--acc)}
/* carta */
.cs{display:grid;place-items:center;align-content:center;text-align:center;min-height:100%}
.env{position:relative;width:min(300px,80vw);aspect-ratio:3/2;border:0;border-radius:10px;background:linear-gradient(160deg,#ffe0ef,#ffc6df);box-shadow:0 14px 30px rgba(0,0,0,.25);transition:transform .2s;color:#fff}
.env:hover{transform:translateY(-4px) rotate(-1deg)}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(to bottom right,transparent 49.500%,rgba(0,0,0,.07) 50%) ,linear-gradient(to bottom left,transparent 49.500%,rgba(0,0,0,.07) 50%);clip-path:polygon(0 0,100% 0,50% 58%)}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#e63b7a;display:grid;place-items:center;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.hint{margin-top:16px;color:var(--mu)}
.paper{display:none;width:min(560px,100%);margin:0 auto;padding:clamp(20px,5vw,40px);text-align:left;background:#fffdf6;color:#3a2f2a;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.25);background-image:repeating-linear-gradient(transparent 0 33px,rgba(120,160,220,.25) 33px 34px);font-family:Caveat,"Segoe Script",cursive;font-size:clamp(1.3rem,3.6vw,1.65rem);line-height:34px}
.paper p{margin:0 0 12px}
#lf{position:fixed;inset:0;z-index:60;overflow:auto;display:flex;padding:clamp(60px,9vh,84px) clamp(12px,4vw,40px) 32px;background:radial-gradient(60% 70% at 18% 30%,rgba(255,110,199,.5),transparent 60%),radial-gradient(55% 65% at 82% 22%,rgba(124,92,255,.6),transparent 60%),#1d1550;animation:up .4s ease}
#lf[hidden]{display:none}
#pick{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:70;padding:11px 18px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(20,20,40,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#pick:hover{background:rgba(40,40,80,.85)}#pick[hidden]{display:none}
#lf .paper{margin:auto;width:min(760px,100%);font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:38px;background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,160,220,.25) 37px 38px)}
#lx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:1;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#lx:hover{background:rgba(255,255,255,.32)}
.paper.on{display:block;animation:up .6s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(60px) scale(.96)}}
.btn{margin:16px auto 0;padding:8px 18px;border:1px solid var(--bd);border-radius:6px;background:var(--card);display:none}
.btn.on{display:block}
/* barra de tareas */
.tk{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:48px;margin:0 -10px;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--tb);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--bd);box-sizing:content-box}
.ti{position:relative;width:44px;height:40px;border:0;border-radius:6px;background:transparent;display:grid;place-items:center;font-size:21px}
.ti:hover{background:var(--tab)}
.ti.run::after{content:"";position:absolute;bottom:2px;width:6px;height:3px;border-radius:3px;background:var(--mu)}.ti.act::after{width:16px;background:var(--acc)}
.sr{display:flex;align-items:center;gap:8px;height:32px;width:170px;padding:0 12px;margin:0 6px;border-radius:99px;background:var(--tab);color:var(--mu);font-size:.8rem}
.tray{position:absolute;right:12px;display:flex;align-items:center;gap:10px;font-size:.72rem;text-align:right;line-height:1.25}
.tray .ic{font-size:15px}
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,20px);padding:10px 16px;border-radius:8px;background:var(--pane);border:1px solid var(--bd);box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:.9rem}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.hero{grid-template-columns:1fr}.cw{order:2}.tray .ic,.ab{display:none}.win{left:0!important;top:0!important;width:100%!important;height:100%!important;max-height:100%!important}.win .pane{flex:1}.icons{flex-direction:row;flex-wrap:wrap;width:100%;align-content:flex-start}.di{width:78px}.tab:not(.on) span{display:none}.tab{padding:0 12px}.sub{max-width:none}}
@media (max-width:760px) and (max-height:700px){#cake{width:170px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:start}
.fo{display:block;padding:8px 8px 0;line-height:1.25;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;transition:background .15s}
.fo:hover{background:var(--tab);border-color:var(--bd)}
.fo b{display:block;padding-bottom:2px;font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fo small{color:var(--mu)}
.th.ph{aspect-ratio:4/3;background:var(--tab);color:var(--acc);overflow:hidden}
.th.ph img{width:100%;height:100%;object-fit:cover;display:block}
.th.vd{position:relative;background:linear-gradient(135deg,hsl(var(--h,210) 80% 55%),hsl(calc(var(--h,210) + 50) 80% 45%));color:#fff}
.th.vd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th.vd .pl{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);font-size:22px}
.th.doc{aspect-ratio:4/3;background:var(--tab);color:var(--acc);font-size:44px}
.fo.add .th{background:var(--tab);color:var(--acc);border:1px dashed var(--bd)}
.em{grid-column:1/-1;display:grid;place-items:center;gap:6px;padding:34px 12px;text-align:center;color:var(--mu)}
.em .ic{font-size:44px;color:var(--acc)}.em b{color:var(--tx);font-size:1.05rem}
.stb{margin-top:16px;padding-top:10px;border-top:1px solid var(--bd);font-size:.78rem;color:var(--mu)}
#vb{padding:6px 16px 18px;max-height:calc(90vh - 60px);overflow:auto}
#vb img{display:block;max-width:100%;max-height:72vh;margin:0 auto;border-radius:8px}
#vb video{display:block;width:100%;max-height:68vh;border-radius:8px;background:#000}
.cs2{display:grid;place-items:center;text-align:center;padding:10px 0}
.wg{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* Adaptación móvil/tablet y ocultar barras de desplazamiento */
html, body, *, *::before, *::after { scrollbar-width: none; }
*::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
.pane, .home, #lf, #vb { -ms-overflow-style: none; scrollbar-width: none; }
.pane, .home, #lf, #vb { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

@media (min-width:761px) and (max-width:1100px) {
  .win { width:min(900px,calc(100% - 24px)); }
  .pane { padding:22px; }
  .fl { grid-template-columns:repeat(auto-fill,minmax(135px,1fr)); gap:10px; }
  .di { width:82px; }
}
@media (max-width:760px) {
  .desk { padding:env(safe-area-inset-top,0px) 0 0; grid-template-rows:minmax(0,1fr) auto; }
  .area { min-height:0; overflow:hidden; }

  .tab { font-size:.78rem; gap:5px; }
  .pane { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px)); }
  .home { overflow-y:auto; padding-bottom:12px; }
  .homei { padding:28px 14px 18px; }
  .hero { grid-template-columns:minmax(0,1fr); gap:8px; }
  .ht { text-align:center; }
  h1 { font-size:clamp(2rem,9vw,3.2rem); }
  h1 b { font-size:clamp(4rem,20vw,6.5rem); }
  .cw { order:initial; }
  #cake { width:min(58vw,210px); max-height:30vh; }
  .sub { font-size:.95rem; margin:10px auto 0; }
  .wg { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .w { padding:10px; gap:8px; min-width:0; }
  .w .bx { width:38px; height:38px; font-size:19px; }
  .w b { font-size:.88rem; }
  .w small { font-size:.72rem; }
  .fl { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .fo { padding:6px 6px 0; min-width:0; }

  .ti { width:42px; height:42px; font-size:20px; }
  .sr, .tray { display:none; }
  #lf { padding:64px 12px calc(20px + env(safe-area-inset-bottom,0px)); }

  #pick { bottom:calc(66px + env(safe-area-inset-bottom,0px)); }
  dialog { width:calc(100vw - 20px); max-height:90dvh; overflow:auto; }
  #vb { max-height:calc(90dvh - 60px); }
  #vb img, #vb video { max-height:65dvh; }
