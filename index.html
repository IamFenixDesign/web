<title>Minijuego del día</title>
<style>
:root{--bg:#fff3d6;--card:#fff;--bd:#1a1a1a;--shc:#1a1a1a;--tx:#1a1a1a;--mu:#5c5646;--y:#ffd23f;--p:#ff7eb6;--m:#6ee7b7;--l:#b79cff;--on:#1a1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#17141f;--card:#262034;--bd:#f5f0ff;--shc:#ff7eb6;--tx:#f5f0ff;--mu:#b5accb}
*{box-sizing:border-box}

.pt{font-size:.85rem;font-weight:800;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:18px 8px;margin-bottom:24px;padding-top:6px}
.d{position:relative;aspect-ratio:1/1.2;border:3px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-weight:900;font-size:1.2rem;cursor:pointer;box-shadow:3px 3px 0 var(--shc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;padding:0;transition:transform .12s,box-shadow .12s}
.d small{font-size:.56rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--mu)}.d:hover:not(.lock){transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--shc)}
.d:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shc)}
.d.sel{background:var(--y);color:var(--on);transform:translateY(-4px) rotate(-3deg);box-shadow:5px 6px 0 var(--shc)}.d.sel small{color:var(--on)}
.d.done{background:var(--m);color:var(--on)}.d.done small{color:var(--on)}
.d.lock{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(128,128,128,.2) 6px 12px),var(--card);border-style:dashed;box-shadow:none;color:var(--mu)}
.d i{position:absolute;top:-10px;right:-9px;width:23px;height:23px;display:grid;place-items:center;border:2.5px solid var(--bd);border-radius:50%;background:var(--card);color:var(--tx);font-style:normal;font-size:.68rem}.d i:empty{display:none}.d.done i{background:var(--m);color:var(--on)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}

.nav button:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shc)}
.nav button:disabled{opacity:.35;box-shadow:none;cursor:default}
.nl{display:table;margin:0 auto 14px;padding:6px 18px;border:3px solid var(--bd);border-radius:99px;background:var(--card);font-weight:900;box-shadow:3px 3px 0 var(--shc)}
.card{position:relative;background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:22px;box-shadow:7px 7px 0 var(--shc)}
.chip{display:inline-block;padding:5px 12px;border:2px solid var(--bd);border-radius:99px;background:var(--l);color:var(--on);font-weight:900;font-size:.8rem}
.q{font-size:1.35rem;line-height:1.4;font-weight:800;margin:16px 0 18px}
.opts{display:grid;gap:12px}
.o{display:flex;gap:12px;align-items:center;padding:13px 14px;border:3px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-weight:800;font-size:1rem;text-align:left;cursor:pointer;box-shadow:3px 3px 0 var(--shc);transition:.1s}

.o:hover:not(:disabled){transform:translate(-1px,-1px)}
.o.ok{background:var(--m);color:var(--on)}
.o.no{background:var(--p);color:var(--on);box-shadow:none;animation:sh .3s}

.msg{margin-top:16px;min-height:1.4em;font-weight:800}

.in{width:100%;padding:14px;border:3px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:1.15rem;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.15em}
.go{display:block;margin:16px auto 0;padding:13px 28px;border:3px solid var(--bd);border-radius:14px;background:var(--p);color:var(--on);font:inherit;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:4px 4px 0 var(--shc)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}.row .go{margin:0}.hb{background:var(--y)}.go:disabled{opacity:.45;box-shadow:none;cursor:default}.hints .h{margin:0 0 10px;padding:10px 14px;border:3px solid var(--bd);border-radius:14px;background:var(--y);color:var(--on);font-weight:800}.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shc)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd{aspect-ratio:1;border:3px solid var(--bd);border-radius:14px;background:var(--l);font-size:1.8rem;color:var(--on);cursor:pointer;box-shadow:3px 3px 0 var(--shc)}
.cd.up{background:var(--y)}.cd.mt{background:var(--m);box-shadow:none}
.arena{position:relative;height:270px;border:3px dashed var(--bd);border-radius:18px;overflow:hidden;background:var(--bg)}
.tg{position:absolute;font-size:2.3rem;background:none;border:0;cursor:pointer;padding:6px;transition:.1s}
.scr{position:relative;height:220px;margin-top:6px;border:3px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--shc)}.scr .ticket{margin:0;height:100%;border:0;border-radius:0;box-shadow:none;transform:none;animation:none;display:flex;flex-direction:column;justify-content:center}.scr canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}button.prize{display:block;width:100%;margin-top:20px;padding:22px;border:3px dashed var(--bd);border-radius:20px;background:var(--y);color:var(--on);font:inherit;font-weight:900;font-size:1.1rem;cursor:pointer}
.gb{display:block;font-size:3.4rem;animation:wob 1.1s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.ticket{margin-top:20px;padding:26px 18px;text-align:center;background:var(--y);color:var(--on);border:3px solid var(--bd);border-radius:20px;box-shadow:6px 6px 0 var(--shc);transform:rotate(-2deg);animation:pop .5s;background-image:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.35) 14px 28px)}
.ticket small{display:inline-block;padding:4px 12px;background:var(--p);border:2px solid var(--bd);border-radius:99px;font-weight:900;letter-spacing:.25em}
.ticket h2{margin:12px 0 8px;font-size:2.1rem;line-height:1.05;font-weight:900;text-transform:uppercase}
.ticket .tl{font-weight:800;border-top:3px dashed var(--bd);padding-top:12px;margin-top:12px}
@keyframes pop{from{transform:scale(.7) rotate(-8deg);opacity:0}}
.cats{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cat{position:absolute;line-height:1;transform:rotate(var(--r));animation:bob 4s ease-in-out infinite}
.cat,h1::after,.card::after,.soon::after{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(3px 5px 0 rgba(0,0,0,.25))}
h1::after{content:"😺";position:absolute;top:-24px;right:-20px;font-size:2.2rem;transform:rotate(14deg);pointer-events:none}
.card::after{content:"🐱";position:absolute;top:-30px;right:18px;font-size:2.4rem;transform:rotate(-8deg);pointer-events:none}
.soon{position:relative;display:flex;gap:14px;align-items:center;margin-top:34px;padding:16px 18px;border:3px solid var(--bd);border-radius:20px;background:var(--p);color:var(--on);box-shadow:5px 5px 0 var(--shc);transform:rotate(1deg);font-weight:700;line-height:1.35}
.soon span{font-weight:800;opacity:.85;font-size:.9rem}.sb{font-size:2rem;flex:0 0 auto}
.soon::after{content:"😻";position:absolute;top:-26px;left:20px;font-size:2.2rem;transform:rotate(-10deg);pointer-events:none}
@keyframes bob{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) + 6deg)) translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.cat{animation:none}}

<div class="cats" id="cats"></div>
<main>
<div class="hero">
<h1 id="t">🎲 Minijuego del día</h1>
<div class="prog z" id="pg"><i></i></div><div class="pt" id="pt"></div>
</div>
<div class="cal" id="cal"></div>
<div class="nl" id="nl"></div>

<div class="nav"><button id="pv" aria-label="Día anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Anterior</button><button id="nx" aria-label="Día siguiente">Siguiente<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>

</main>
<script>
const R=[
{k:"🧩 Adivinanza",q:"Tengo ciudades pero no casas, ríos pero no agua y montañas pero no tierra. ¿Qué soy?",o:["Un mapa","Un sueño","Un cuadro","Un globo"],a:0},
{k:"😀 Adivina por emojis",q:"🦁👑",o:["El Rey León","Madagascar","Tarzán","Simba y Nala"],a:0},
{k:"🔤 Ordena la palabra",q:"TADMISA",w:"AMISTAD",t:"scr",h:["Es el vínculo entre buenas amigas 💜","Empieza con la letra A","Termina con la letra D"]},
{k:"🃏 Memoria",t:"mem",e:["🐶","🍕","🎧","🌈","🦋","🍓"]},
{k:"🔢 Secuencia",q:"2 · 4 · 8 · 16 · ?",o:["20","24","32","30"],a:2},
{k:"🧩 Adivinanza",q:"Cuanto más seco estoy, más mojo. ¿Qué soy?",o:["Una esponja","Una toalla","El sol","Un secador"],a:1},
{k:"⚡ Reflejos",t:"tap",n:10,s:10,e:"💖"},
{k:"😀 Adivina por emojis",q:"🕷️👨",o:["Batman","Hombre Araña","Ant-Man","Venom"],a:1},
{k:"🔤 Ordena la palabra",q:"JUATTEA",w:"TATUAJE",t:"scr",h:["Se hace con tinta y aguja, y es para siempre","Empieza con la letra T","Termina con la letra E"]},
{k:"🧠 Trivia",q:"¿Cuántos colores tiene el arcoíris?",o:["5","6","7","8"],a:2},
{k:"🃏 Memoria difícil",t:"mem",e:["🍔","🎸","🌙","🔥","🐱","🚀","🍦","⭐"]},
{k:"🧩 Adivinanza",q:"Tengo manos pero no puedo aplaudir. ¿Qué soy?",o:["Un guante","Un maniquí","Un reloj","Un mono"],a:2},
{k:"⚡ Reflejos difíciles",t:"tap",n:12,s:8,e:"⭐"},
{k:"🎁 Sorpresa final",t:"scratch"}
];
const Y=2026,M=10,D0=21,K="mini-v3";
let st={},all=false,sel=0,taps=0,tm=null;
try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
let hs={};try{hs=JSON.parse(localStorage.getItem(K+"h")||"{}")}catch(e){}
const saveh=()=>{try{localStorage.setItem(K+"h",JSON.stringify(hs))}catch(e){}};
const dt=i=>new Date(Y,M,D0+i);
const open=i=>all||new Date()>=dt(i);
const fmt=i=>dt(i).toLocaleDateString("es",{day:"numeric",month:"long"});
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
sel=(()=>{let n=0;R.forEach((_,i)=>{if(open(i))n=i});return n})();
function days(){const el=document.getElementById("cal");el.innerHTML="";R.forEach((_,i)=>{const b=document.createElement("button");const d=dt(i);b.className="d"+(i==sel?" sel":"")+(!open(i)?" lock":"")+(st[i]?" done":"");b.innerHTML=`<small>${d.toLocaleDateString("es",{weekday:"short"}).replace(".","")}</small>${d.getDate()}<i>${st[i]?"✓":!open(i)?"🔒":i==R.length-1?"🎁":""}</i>`;b.onclick=()=>{sel=i;render()};el.appendChild(b)})}
function nav(){document.getElementById("pv").style.visibility=sel<=0?"hidden":"visible";document.getElementById("nx").style.visibility=(sel>=R.length-1||!open(sel+1))?"hidden":"visible";document.getElementById("nl").textContent=`Día ${sel+1} de ${R.length}`}
function go(d){const n=sel+d;if(n>=0&&n<R.length&&open(n)){sel=n;render()}}
function score(){const n=Object.keys(st).length;const p=document.getElementById("pg");p.className="prog"+(n?"":" z");p.firstChild.style.width=(n/R.length*100)+"%";document.getElementById("pt").textContent=`${n}/${R.length} ✓`}
function win(i,m,msg){st[i]=1;save();m.textContent=msg||"¡Lo lograste! 🎉";days();score()}
function render(){
clearInterval(tm);days();nav();const c=document.getElementById("card"),i=sel,r=R[i];
if(!open(i)){c.innerHTML=`<div class="lockbox"><big>🔒</big>Este minijuego se desbloquea el <b>${fmt(i)}</b>.<br>¡Vuelve ese día!</div>`;score();return}
c.innerHTML=`<div id="g"></div><div class="msg"></div>`;
const g=c.querySelector("#g"),m=c.querySelector(".msg");
if(!r.t)choice(g,m,i,r);else if(r.t=="scr")scr(g,m,i,r);else if(r.t=="mem")mem(g,m,i,r);else if(r.t=="scratch")scratch(g,m,i);else tap(g,m,i,r);

score()}
function choice(g,m,i,r){
g.innerHTML=`<div class="q">${r.q}</div><div class="opts"></div>`;const o=g.querySelector(".opts");
r.o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.innerHTML=`<b>${"ABCD"[k]}</b><span></span>`;b.lastChild.textContent=t;
b.onclick=()=>{if(k===r.a){b.classList.add("ok");[...o.children].forEach(x=>x.disabled=true);win(i,m,"¡Correcto! 🎉")}else{b.classList.add("no");m.textContent="Ups, prueba otra vez 😅";setTimeout(()=>{b.classList.remove("no");if(!st[i])m.textContent=""},800)}};o.appendChild(b)});
if(st[i]){o.children[r.a].classList.add("ok");[...o.children].forEach(x=>x.disabled=true)}}
function scr(g,m,i,r){
g.innerHTML=`<div class="q" style="text-align:center">Ordena las letras y escribe la palabra</div><div class="big">${r.q}</div><div class="hints"></div><input class="in" placeholder="Tu respuesta" autocomplete="off"><div class="row"><button class="go ck">Comprobar</button><button class="go hb"></button></div>`;
const f=g.querySelector("input"),hb=g.querySelector(".hb"),hl=g.querySelector(".hints");let n=hs[i]||0;

function scratch(g,m,i){

cv.width=cv.clientWidth||320;cv.height=cv.clientHeight||220;const W=cv.width,H=cv.height,x=cv.getContext("2d");
const gr=x.createLinearGradient(0,0,W,H);gr.addColorStop(0,"#b9bcc9");gr.addColorStop(.5,"#f1f2f7");gr.addColorStop(1,"#a3a7b8");x.fillStyle=gr;x.fillRect(0,0,W,H);

x.fillStyle="#4a4e63";x.textAlign="center";x.textBaseline="middle";x.font="900 30px Trebuchet MS,system-ui,sans-serif";x.fillText("RASCA Y GANA",W/2,H/2-12);x.font="26px system-ui,sans-serif";x.fillText("🎁 ✨ 🎁",W/2,H/2+28);
x.globalCompositeOperation="destination-out";x.lineWidth=42;x.lineCap=x.lineJoin="round";
let dn=false,lx=0,ly=0,done=false,shown=false;

const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const pct=()=>{const d=x.getImageData(0,0,W,H).data;let c=0,n=0;for(let p=3;p<d.length;p+=64){n++;if(d[p]<20)c++}return c/n};
const rev=()=>{if(done)return;done=true;show();cv.style.transition="opacity .5s";cv.style.opacity=0;cv.style.pointerEvents="none";setTimeout(()=>cv.remove(),600);st[i]=1;save();days();score();confetti();m.textContent="¡Premio desbloqueado! 🎉"};
cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e)};
cv.onpointermove=e=>{if(!dn)return;show();const[a,b]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(a,b);x.stroke();lx=a;ly=b};
cv.onpointerup=()=>{dn=false;if(shown&&pct()>.55)rev()}}
function confetti(){const E=["💜","🖤","✨","🎉","⭐"];for(let n=0;n<40;n++){const s=document.createElement("span");s.textContent=E[n%5];s.style.cssText=`position:fixed;top:-30px;left:${Math.random()*100}vw;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:99`;document.body.appendChild(s);s.animate([{transform:"translateY(0)"},{transform:`translateY(110vh) rotate(${Math.random()*540}deg)`}],{duration:2200+Math.random()*2200,easing:"ease-in"}).onfinish=()=>s.remove()}}
